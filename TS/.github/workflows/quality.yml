name: Quality

# Large projects: swap ts:mutants for ts:mutants:diff in the
# ts:standards:check task graph and move the full mutation sweep to a
# scheduled workflow (see README). The restore/save pair below keeps Stryker's
# incremental file warm even when a mutation run fails; without it a fresh CI
# checkout makes ts:mutants:diff a cold full sweep.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Stryker incremental state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-v1-${{ runner.os }}-${{ hashFiles('.config/mise/conf.d/20-ts.toml', '.config/mise/mise.lock', 'bun.lock', 'bunfig.toml', 'package.json', 'stryker.config.mjs', 'tsconfig.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-incremental-v1-${{ runner.os }}-${{ hashFiles('.config/mise/conf.d/20-ts.toml', '.config/mise/mise.lock', 'bun.lock', 'bunfig.toml', 'package.json', 'stryker.config.mjs', 'tsconfig.json') }}-${{ github.sha }}-
            stryker-incremental-v1-${{ runner.os }}-${{ hashFiles('.config/mise/conf.d/20-ts.toml', '.config/mise/mise.lock', 'bun.lock', 'bunfig.toml', 'package.json', 'stryker.config.mjs', 'tsconfig.json') }}-
      - name: Install pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.7.15'
          install: true
          cache: true
      - name: Install locked dependencies
        run: mise run ts:install
      - name: Run the mandatory gate
        run: mise run standards:check
      - name: Validate Stryker incremental state
        id: validate-stryker-cache
        if: ${{ !cancelled() && hashFiles('reports/stryker-incremental.json') != '' }}
        continue-on-error: true
        run: mise run ts:mutants:cache:check
      - name: Save Stryker incremental state
        if: ${{ !cancelled() && steps.validate-stryker-cache.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-v1-${{ runner.os }}-${{ hashFiles('.config/mise/conf.d/20-ts.toml', '.config/mise/mise.lock', 'bun.lock', 'bunfig.toml', 'package.json', 'stryker.config.mjs', 'tsconfig.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
