min_version = "2026.7.0"
monorepo_root = true

[monorepo]
config_roots = ["testers/*"]
lockfile = false

[settings]
# Sized for the maintainer's 32-thread workstation, the only host where this
# root gate runs end to end. Fixture tasks stay bounded below by their own
# tool concurrency settings (for example the TypeScript Stryker workers).
jobs = 8
lockfile = true

[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
python = "3.14.7"

[tasks."standards:eslint-prettier:check"]
description = "Validate the secondary ESLint and Prettier TypeScript profile"
run = "scripts/check-eslint-prettier-template.sh"

[tasks."standards:drift"]
description = "Check standards profile contracts and fixture drift"
run = [
  "scripts/check-standards-drift.py",
  "scripts/check-ignore-contracts.py",
  "scripts/check-profile-governance.mjs",
]

[tasks.secrets]
description = "Scan the standards repository for secrets"
run = "gitleaks dir . --redact --no-banner"

[tasks.standards]
description = "Run repository standards workflows and available autofixes"
run = [
  { task = "md:standards" },
  { task = "shell:standards" },
  { task = "//testers/...:standards" },
]

[tasks."standards:check"]
description = "Run the standards repository CI gate"
# Scan the tree before fixture gates write temporary probe files into it.
depends = ["secrets", "hygiene"]
run = [
  { tasks = [
    "standards:eslint-prettier:check",
    "standards:drift",
    "md:standards:check",
    "shell:standards:check",
    "//testers/...:standards:check",
  ] },
]
