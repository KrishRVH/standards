[tools]
dotnet = "10.0.302"

[tasks."csharp:restore"]
description = "Restore .NET dependencies"
run = "dotnet restore"

[tasks."csharp:fmt"]
description = "Format C# code"
depends = ["csharp:restore"]
run = "dotnet format --no-restore"

[tasks."csharp:fmt:check"]
description = "Check C# formatting"
depends = ["csharp:restore"]
run = "dotnet format --verify-no-changes --no-restore"

[tasks."csharp:policy"]
description = "Self-test the verifier and prove representative analyzer walls"
depends = ["csharp:fmt:check"]
run = "dotnet run --file scripts/verify-standards.cs -- policy"

[tasks."csharp:lint"]
description = "Build C# with analyzers enabled"
depends = ["csharp:policy", "csharp:restore"]
run = "dotnet build --no-restore --configuration Release -warnaserror -p:ContinuousIntegrationBuild=true -p:TreatWarningsAsErrors=true"

[tasks."csharp:test"]
description = "Run C# tests"
depends = ["csharp:restore"]
wait_for = ["csharp:lint"]
run = "dotnet test --no-restore --configuration Release --results-directory TestResults -- --report-trx"

[tasks."csharp:mutants:install"]
description = "Restore the pinned dotnet-stryker local tool"
run = "dotnet tool restore"

[tasks."csharp:mutants"]
description = "Run the full mutation sweep; a surviving mutant is a review finding"
depends = ["csharp:mutants:install", "csharp:restore"]
wait_for = ["csharp:test"]
run = """
set -eu

output_root="${STRYKER_OUTPUT_ROOT:-StrykerOutput}"
mkdir -p "$output_root"
output_dir="$(mktemp -d "$output_root/standards-full.XXXXXX")"
run_log="$output_dir/stryker.log"

set +e
dotnet stryker --config-file stryker-config.json --output "$output_dir" >"$run_log" 2>&1
status=$?
set -e
cat "$run_log"
if [ "$status" -ne 0 ]; then
  echo "Stryker failed; preserved diagnostics in $output_dir" >&2
  exit "$status"
fi

report="$output_dir/reports/mutation-report.json"
dotnet run --file scripts/verify-standards.cs -- stryker full "$report" "$run_log"
echo "Preserved verified mutation evidence in $output_dir"
"""

[tasks."csharp:mutants:diff"]
description = "Mutation-test changed code; default base prefers origin/main"
depends = ["csharp:mutants:install", "csharp:restore"]
run = """
set -eu

if [ -n "${MUTANTS_BASE_REF:-}" ]; then
  base_ref="$MUTANTS_BASE_REF"
  if ! base_commit="$(git rev-parse --verify --quiet "$base_ref^{commit}")"; then
    echo "Cannot resolve explicit MUTANTS_BASE_REF '$base_ref'." >&2
    exit 1
  fi
elif base_commit="$(git rev-parse --verify --quiet 'refs/remotes/origin/main^{commit}')"; then
  base_ref="origin/main"
elif base_commit="$(git rev-parse --verify --quiet 'refs/heads/main^{commit}')"; then
  base_ref="main"
else
  echo "Cannot resolve default base refs/remotes/origin/main or refs/heads/main." >&2
  exit 1
fi

if ! merge_base="$(git merge-base HEAD "$base_commit")"; then
  echo "Cannot compute a merge base with $base_ref. Fetch full history with git fetch --unshallow or git fetch origin main." >&2
  exit 1
fi
if ! printf '%s\n' "$merge_base" | grep -Eq '^[0-9a-f]{40}$'; then
  echo "git merge-base did not return an exact 40-character commit SHA." >&2
  exit 1
fi
if ! untracked_files="$(git ls-files --others --exclude-standard)"; then
  echo "Cannot inspect untracked files before mutation diff testing." >&2
  exit 1
fi
if [ -n "$untracked_files" ]; then
  echo "Mutation diff testing cannot include these untracked files:" >&2
  printf '%s\n' "$untracked_files" >&2
  echo "Stage them, or run git add -N <path> for each file so the diff becomes reviewable." >&2
  exit 1
fi

dotnet run --file scripts/verify-standards.cs -- git-refs "$merge_base"

if git diff --quiet "$merge_base" --; then
  echo "No changes relative to $merge_base; nothing to mutate."
  exit 0
fi

output_root="${STRYKER_OUTPUT_ROOT:-StrykerOutput}"
mkdir -p "$output_root"
output_dir="$(mktemp -d "$output_root/standards-diff.XXXXXX")"
run_log="$output_dir/stryker.log"

set +e
dotnet stryker --config-file stryker-config.json --since:"$merge_base" --output "$output_dir" >"$run_log" 2>&1
status=$?
set -e
cat "$run_log"
if [ "$status" -ne 0 ]; then
  echo "Stryker failed; preserved diagnostics in $output_dir" >&2
  exit "$status"
fi

report="$output_dir/reports/mutation-report.json"
dotnet run --file scripts/verify-standards.cs -- stryker diff "$report" "$run_log"
echo "Preserved verified mutation evidence in $output_dir"
"""

[tasks."csharp:standards"]
description = "Run the C# standards workflow with autofixes"
depends = ["csharp:fmt"]

[tasks."csharp:standards:check"]
description = "Run the C# standards CI gate"
depends = ["csharp:fmt:check", "csharp:lint", "csharp:test", "csharp:mutants"]
