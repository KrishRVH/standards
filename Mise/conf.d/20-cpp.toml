[tools]
"github:llvm/llvm-project" = { version = "22.1.8", version_prefix = "llvmorg-" }
clang-format = "22.1.8"
cmake = "4.4.0"
ninja = "1.13.2"

[tasks."cpp:fmt"]
description = "Format C++ sources"
run = "./cpp-format.sh write"

[tasks."cpp:fmt:check"]
description = "Check C++ source formatting"
run = "./cpp-format.sh check"

[tasks."cpp:lint"]
description = "Run clangd semantic and clang-tidy checks"
run = ["cmake --preset clang", "./cpp-quality.sh . build/clang"]

[tasks."cpp:test"]
description = "Build with warnings as errors and run pinned Debug and Release tests"
# cpp:lint configures the same build/clang directory, so the two never overlap.
wait_for = ["cpp:lint"]
run = "./cpp-build.sh"

[tasks."cpp:portability"]
description = "Run C++ checks with available alternate and cross compilers"
run = "./cpp-build.sh portability"

[tasks."cpp:msvc"]
description = "Build with clang-cl against the MSVC CRT and Windows SDK"
tools = { "conda:clang" = "22.1.8", "conda:lld" = "22.1.8", "conda:llvm-tools" = "22.1.8", "github:Jake-Shadle/xwin" = "0.10.0" }
run = "./cpp-build.sh msvc"

[tasks."cpp:standards"]
description = "Run the C++ standards workflow with autofixes"
depends = ["cpp:fmt"]

[tasks."cpp:standards:check"]
description = "Run the C++ standards CI gate"
depends = ["cpp:fmt:check", "cpp:lint", "cpp:test"]
