# Graph-locked gdtoolkit needs mise.lock revision 2, which mise 2026.9.7 added.
min_version = "2026.9.7"

[tools]
# The Godot release binary carries its version in its file name; symlink_bins
# exposes it under the aqua registry's `godot` name.
godot = { version = "4.7-stable", symlink_bins = true }
python = "3.14.7"
uv = "0.12.19"
"pypi:gdtoolkit" = "4.5.0"

[tasks."godot:fmt"]
description = "Format GDScript source"
run = "gdformat src tests"

[tasks."godot:fmt:check"]
description = "Check GDScript formatting"
run = "gdformat --check src tests"

[tasks."godot:gdlint"]
description = "Run GDScript style and complexity checks"
hide = true
run = "gdlint src tests"

[tasks."godot:import"]
description = "Import Godot project resources headlessly"
run = "godot --headless --path . --import"

[tasks."godot:check"]
description = "Import the project, then parse, type-check, and load every owned GDScript file"
run = '''
set -eu
tmp="$(mktemp)"
trap 'rm -f "$tmp"' EXIT

run_godot_checked() {
  set +e
  godot "$@" >"$tmp" 2>&1
  status="$?"
  set -e
  cat "$tmp"
  if [ "$status" -ne 0 ]; then
    return "$status"
  fi
  if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$tmp" >/dev/null; then
    return 1
  fi
}

check_metadata=0
metadata_before=
if command -v git >/dev/null 2>&1 && git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
  check_metadata=1
  metadata_snapshot() {
    git status --porcelain -- '*.uid' '*.import'
    git ls-files --cached --others --exclude-standard -z -- '*.uid' '*.import' |
      xargs -0 -n 1 sh -c '
        [ ! -f "$1" ] || git hash-object -- "$1"
      ' sh
  }
  metadata_before="$(metadata_snapshot)"
fi
run_godot_checked --headless --path . --import
if [ "$check_metadata" -eq 1 ]; then
  metadata_after="$(metadata_snapshot)"
  if [ "$metadata_before" != "$metadata_after" ]; then
    echo "Godot import metadata changed; commit the generated files:" >&2
    git status --porcelain -- '*.uid' '*.import' >&2
    exit 1
  fi
fi

run_godot_checked --headless --path . --script res://tests/gdscript_load_check.gd
'''

[tasks."godot:lint"]
description = "Lint and type-check GDScript"
depends = ["godot:gdlint", "godot:check"]

[tasks."godot:test"]
description = "Run headless GDScript tests"
# Godot writes its import cache under .godot/; run after godot:check in a gate.
wait_for = ["godot:check"]
run = '''
set -eu
if [ ! -f tests/run_tests.gd ]; then
  echo "tests/run_tests.gd is required; add a native runner or replace godot:test." >&2
  exit 1
fi

tmp="$(mktemp)"
trap 'rm -f "$tmp"' EXIT

run_godot_checked() {
  set +e
  godot "$@" >"$tmp" 2>&1
  status="$?"
  set -e
  cat "$tmp"
  if [ "$status" -ne 0 ]; then
    return "$status"
  fi
  if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$tmp" >/dev/null; then
    return 1
  fi
}

run_godot_checked --headless --path . --import
run_godot_checked --headless --path . --script res://tests/run_tests.gd
'''

[tasks."godot:standards"]
description = "Run the GDScript standards workflow with autofixes"
depends = ["godot:fmt"]

[tasks."godot:standards:check"]
description = "Run the GDScript standards CI gate"
depends = ["godot:fmt:check", "godot:lint", "godot:test"]
