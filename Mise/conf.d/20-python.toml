[tools]
python = "3.14.6"
uv = "0.11.32"

[tasks."py:install"]
description = "Install Python dependencies"
wait_for = ["py:lock:check"]
run = """
if [ ! -f pyproject.toml ]; then
  echo "No pyproject.toml found."
  exit 0
fi

uv sync --locked
"""

[tasks."py:install:deep"]
description = "Install Python dependencies including optional deep analyzers"
run = """
if [ ! -f pyproject.toml ]; then
  echo "No pyproject.toml found."
  exit 0
fi

if [ -f uv.lock ]; then
  uv sync --group deep --locked
else
  uv sync --group deep
fi
"""

[tasks."py:lock"]
description = "Refresh the uv lockfile"
run = "uv lock"

[tasks."py:lock:check"]
description = "Ensure the uv lockfile is present and current"
run = """
if [ ! -f uv.lock ]; then
  echo "uv.lock is required for Python CI. Run mise run py:lock and commit the generated lockfile." >&2
  exit 1
fi

uv lock --check
"""

[tasks."py:fmt"]
description = "Format Python source and tests"
depends = ["py:install"]
run = "uv run ruff format ."

[tasks."py:fmt:check"]
description = "Check Python formatting"
depends = ["py:install"]
run = "uv run ruff format --check ."

[tasks."py:ruff"]
description = "Run Ruff lint rules"
depends = ["py:install"]
run = "uv run ruff check ."

[tasks."py:type"]
description = "Run strict Python type analysis"
depends = ["py:install"]
run = "uv run basedpyright --warnings"

[tasks."py:type:mypy"]
description = "Run optional strict mypy analysis"
depends = ["py:install:deep"]
run = "uv run --no-sync mypy"

[tasks."py:deps"]
description = "Check Python dependency hygiene"
depends = ["py:install"]
run = "uv run deptry ."

[tasks."py:docs"]
description = "Report Python docstring coverage"
depends = ["py:install:deep"]
run = "uv run --no-sync interrogate --fail-under=100 ."

[tasks."py:complexity"]
description = "Check Python complexity budgets"
depends = ["py:install:deep"]
run = """
paths=""
[ -d src ] && paths="$paths src"
[ -d tests ] && paths="$paths tests"

if [ -z "$paths" ]; then
  echo "No src or tests directories found; skipping xenon."
else
  uv run --no-sync xenon --max-absolute B --max-modules A --max-average A $paths
fi
"""

[tasks."py:slots"]
description = "Check dataclass slot coverage"
depends = ["py:install:deep"]
run = """
if [ ! -d src ]; then
  echo "No src directory found; skipping slotscheck."
  exit 0
fi

uv run --no-sync slotscheck src
"""

[tasks."py:security"]
description = "Run Python security analysis"
depends = ["py:install"]
run = """
if [ -d src ]; then
  uv run bandit -c pyproject.toml -r src
else
  echo "No src directory found; skipping bandit."
fi
"""

[tasks."py:audit"]
description = "Audit Python dependencies"
depends = ["py:install"]
run = "uv audit --preview-features audit-command --locked"

[tasks."py:deadcode"]
description = "Check for high-confidence dead Python code"
depends = ["py:install:deep"]
run = "uv run --no-sync vulture"

[tasks."py:lint"]
description = "Run default Python static analysis"
depends = ["py:ruff", "py:type", "py:security"]

[tasks."py:deep"]
description = "Run optional dependency-sensitive Python analysis"
depends = ["py:type:mypy", "py:docs", "py:complexity", "py:slots", "py:deadcode"]

[tasks."py:test"]
description = "Run Python tests with branch coverage"
depends = ["py:install"]
run = "uv run pytest"

[tasks."py:build"]
description = "Build Python source and wheel distributions"
depends = ["py:install"]
run = "uv build"

[tasks."py:mutants"]
description = "Run the full mutation sweep; a surviving mutant is a review finding"
depends = ["py:install"]
wait_for = ["py:test"]
run = """
set -eu

uv run mutmut run
uv run mutmut export-cicd-stats
uv run python - <<'PY'
# Gate the mutation score against the committed ratchet floor.
import json
import os
import pathlib
import sys

stats = json.loads(pathlib.Path("mutants/mutmut-cicd-stats.json").read_text(encoding="utf-8"))
total = stats["total"]
if not total:
    sys.exit("mutmut generated no mutants; check [tool.mutmut] source_paths.")
score = 100 * stats["killed"] / total
floor_file = pathlib.Path(".mutmut-floor")
floor_env = os.environ.get("MUTMUT_FLOOR")
if floor_file.is_file():
    floor = float(floor_file.read_text(encoding="utf-8"))
elif floor_env is not None:
    # Bootstrap only: the committed floor is authoritative once it exists.
    floor = float(floor_env)
else:
    sys.exit("No mutation floor. Commit .mutmut-floor with the measured score, or set MUTMUT_FLOOR to bootstrap.")
if score < floor:
    sys.exit(f"Mutation score {score:.2f} is below the ratchet floor {floor:g}.")
print(f"Mutation score {score:.2f} meets the ratchet floor {floor:g}.")
PY
"""

[tasks."py:standards"]
description = "Run the Python standards workflow with autofixes"
depends = ["py:install"]
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks."py:standards:check"]
description = "Run the Python standards CI gate"
depends = ["py:lock:check", "py:fmt:check", "py:lint", "py:test", "py:build", "py:audit", "py:deps", "py:mutants"]

[tasks."py:standards:check:deep"]
description = "Run the Python standards CI gate plus optional deep analysis"
run = [
  { task = "py:standards:check" },
  { task = "py:deep" },
]
