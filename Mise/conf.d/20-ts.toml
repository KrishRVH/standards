[tools]
bun = "1.4.1"

[tasks."ts:install"]
description = "Install Bun-managed TypeScript/JavaScript dependencies"
depends = ["ts:lock:check"]
run = "bun install --frozen-lockfile"

[tasks."ts:lock"]
description = "Refresh the Bun lockfile"
run = "bun install"

[tasks."ts:lock:check"]
description = "Ensure the Bun lockfile is present"
run = """
if [ ! -f bun.lock ]; then
  echo "bun.lock is required for TypeScript/JavaScript CI. Run mise run ts:lock and commit the generated lockfile." >&2
  exit 1
fi
"""

[tasks."ts:run"]
description = "Run a Bun package script: mise run ts:run -- <script>"
usage = "arg \"script\""
run = "bun run \"$usage_script\""

[tasks."ts:fmt"]
description = "Format TypeScript/JavaScript"
depends = ["ts:install"]
run = "bun run format"

[tasks."ts:fmt:check"]
description = "Check TypeScript/JavaScript formatting"
depends = ["ts:install"]
run = "bun run format:check"

[tasks."ts:lint"]
description = "Lint TypeScript/JavaScript"
depends = ["ts:install"]
run = "bun run lint"

[tasks."ts:lint:secondary"]
description = "Lint TypeScript/JavaScript with the secondary ESLint profile"
depends = ["ts:install"]
run = "bun run lint:secondary"

[tasks."ts:type"]
description = "Run TypeScript type checks"
depends = ["ts:install"]
run = "bun run typecheck"

[tasks."ts:type-tests:check"]
description = "Verify isolated TypeScript negative contracts"
depends = ["ts:install"]
run = "bun run type-tests:check"

[tasks."ts:effect:check"]
description = "Run Effect-specific diagnostics"
depends = ["ts:install"]
run = "bun run effect:check"

[tasks."ts:effect:diagnostics:check"]
description = "Verify blocking Effect diagnostics with negative fixtures"
depends = ["ts:install"]
run = "bun run effect:diagnostics:check"

[tasks."ts:effect:overview"]
description = "Summarize Effect services, layers, and errors for agents"
depends = ["ts:install"]
run = "bun run effect:overview"

[tasks."ts:test"]
description = "Run TypeScript/JavaScript tests"
depends = ["ts:install"]
run = "bun run test"

[tasks."ts:audit"]
description = "Audit TypeScript/JavaScript dependencies"
depends = ["ts:install"]
run = "bun run audit"

[tasks."ts:knip"]
description = "Fail on unused dependencies, exports, and files"
depends = ["ts:install"]
run = "bun run knip"

[tasks."ts:preflight"]
description = "Run every non-mutation TypeScript/JavaScript gate before mutation testing"
depends = ["ts:install"]
run = "bun run standards:check"

[tasks."ts:mutants"]
description = "Run the full mutation sweep; a surviving mutant is a review finding"
depends = ["ts:preflight"]
run = "bun scripts/run-stryker.mjs full stryker.config.mjs"

[tasks."ts:mutants:diff"]
description = "Run the incremental mutation-testing inner loop"
depends = ["ts:preflight"]
run = "bun scripts/run-stryker.mjs incremental stryker.config.mjs"

[tasks."ts:mutants:cache:check"]
description = "Validate Stryker incremental state before saving it in CI"
depends = ["ts:install"]
run = "bun run scripts/check-stryker-cache.mjs reports/stryker-incremental.json"

[tasks."ts:standards"]
description = "Run the TypeScript/JavaScript standards workflow with autofixes"
depends = ["ts:install"]
run = "bun run standards"

[tasks."ts:standards:secondary"]
description = "Run the secondary ESLint and Prettier workflow with autofixes"
depends = ["ts:install"]
run = "bun run standards:secondary"

[tasks."ts:standards:secondary:check"]
description = "Check the secondary ESLint and Prettier workflow"
depends = ["ts:install"]
run = "bun run standards:secondary:check"

[tasks."ts:standards:check"]
description = "Run the TypeScript/JavaScript standards CI gate"
depends = ["ts:mutants"]
