[tools]
rust = "1.97.1"

[tasks."rust:components"]
description = "Install Rust formatter and linter components"
run = """
set -eu

toolchain="$(rustc -vV | sed -n 's/^host: //p')"
version="$(rustc --version | awk '{print $2}')"

rustup component add --toolchain "$version-$toolchain" rustfmt clippy
"""

[tasks."rust:deny:install"]
description = "Install pinned cargo-deny"
wait_for = ["rust:components"]
run = """
set -eu

cargo_deny_version="0.20.2"
cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
cargo_deny="$cargo_tools_dir/bin/cargo-deny"

if [ ! -x "$cargo_deny" ] || ! "$cargo_deny" --version | grep -qxF "cargo-deny $cargo_deny_version"; then
  cargo install cargo-deny --version "$cargo_deny_version" --locked --root "$cargo_tools_dir"
fi
"""

[tasks."rust:mutants:install"]
description = "Install pinned cargo-mutants"
wait_for = ["rust:components"]
run = """
set -eu

cargo_mutants_version="27.1.0"
cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
cargo_mutants="$cargo_tools_dir/bin/cargo-mutants"

if [ ! -x "$cargo_mutants" ] || ! "$cargo_mutants" mutants --version | grep -qxF "cargo-mutants $cargo_mutants_version"; then
  cargo install cargo-mutants --version "$cargo_mutants_version" --locked --root "$cargo_tools_dir"
fi
"""

[tasks."rust:machete:install"]
description = "Install pinned cargo-machete"
wait_for = ["rust:components"]
run = """
set -eu

cargo_machete_version="0.9.2"
cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
cargo_machete="$cargo_tools_dir/bin/cargo-machete"

if [ ! -x "$cargo_machete" ] || ! "$cargo_machete" --version | grep -qxF "$cargo_machete_version"; then
  cargo install cargo-machete --version "$cargo_machete_version" --locked --root "$cargo_tools_dir"
fi
"""

[tasks."rust:lock:check"]
description = "Ensure Cargo.lock exists and matches Cargo metadata"
run = """
set -eu

if [ ! -f Cargo.lock ]; then
  if [ "${CI:-false}" = "true" ]; then
    echo "Cargo.lock is required in CI. Run mise run rust:lock:check locally and commit Cargo.lock." >&2
    exit 1
  fi

  cargo generate-lockfile
fi

cargo metadata --locked --format-version=1 >/dev/null
"""

[tasks."rust:fmt"]
description = "Format Rust code"
depends = ["rust:components"]
run = "cargo fmt --all"

[tasks."rust:fmt:check"]
description = "Check Rust formatting"
depends = ["rust:components"]
run = "cargo fmt --all -- --check"

[tasks."rust:lint"]
description = "Run Clippy for all Rust workspace targets/features"
depends = ["rust:components", "rust:lock:check"]
wait_for = ["rust:fmt:check"]
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks."rust:test"]
description = "Run Rust tests for all workspace targets/features"
depends = ["rust:lock:check"]
wait_for = ["rust:lint"]
run = "cargo test --workspace --all-targets --all-features --locked"

[tasks."rust:test:doc"]
description = "Run Rust doctests"
depends = ["rust:lock:check"]
wait_for = ["rust:test"]
run = "cargo test --workspace --doc --all-features --locked"

[tasks."rust:doc"]
description = "Build Rust documentation with warnings denied"
depends = ["rust:lock:check"]
wait_for = ["rust:test:doc"]
run = "RUSTDOCFLAGS=\"-D warnings -D missing_docs\" cargo doc --workspace --all-features --no-deps --locked"

[tasks."rust:package"]
description = "Validate Rust package contents"
depends = ["rust:lock:check"]
wait_for = ["rust:doc"]
run = "cargo package --workspace --allow-dirty --locked"

[tasks."rust:mutants"]
description = "Run mutation testing; a surviving mutant is a review finding"
depends = ["rust:mutants:install", "rust:lock:check"]
wait_for = ["rust:test"]
run = """
set -eu

cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
"$cargo_tools_dir/bin/cargo-mutants" mutants --workspace --all-features --cargo-arg=--locked
"""

[tasks."rust:mutants:diff"]
description = "Mutation-test only code changed relative to MUTANTS_BASE_REF (default main)"
depends = ["rust:mutants:install", "rust:lock:check"]
run = """
set -eu

base_ref="${MUTANTS_BASE_REF:-main}"
diff_file="$(mktemp)"
trap 'rm -f "$diff_file"' EXIT

git diff --relative "$(git merge-base HEAD "$base_ref")" > "$diff_file"

if [ ! -s "$diff_file" ]; then
  echo "No changes relative to $base_ref; nothing to mutate."
  exit 0
fi

cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
"$cargo_tools_dir/bin/cargo-mutants" mutants --workspace --all-features --cargo-arg=--locked --in-diff "$diff_file"
"""

[tasks."rust:machete"]
description = "Detect unused [dependencies] entries (dev/build deps are not checked)"
depends = ["rust:machete:install"]
run = """
set -eu

cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
"$cargo_tools_dir/bin/cargo-machete"
"""

[tasks."rust:deny"]
description = "Run cargo-deny dependency policy checks"
depends = ["rust:deny:install", "rust:lock:check"]
run = """
set -eu

cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
"$cargo_tools_dir/bin/cargo-deny" --workspace --all-features --locked check -A license-not-encountered
"""

[tasks."rust:standards"]
description = "Run the Rust standards workflow with autofixes"
depends = ["rust:fmt"]

[tasks."rust:standards:check"]
description = "Run the Rust standards CI gate"
depends = [
  "rust:fmt:check",
  "rust:lint",
  "rust:test",
  "rust:test:doc",
  "rust:doc",
  "rust:package",
  "rust:mutants",
  "rust:machete",
  "rust:deny",
]
