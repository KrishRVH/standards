[tools]
rust = "1.98.1"

[tasks."rust:components"]
description = "Install Rust formatter and linter components"
run = """
set -eu

toolchain="$(rustc -vV | sed -n 's/^host: //p')"
version="$(rustc --version | awk '{print $2}')"

rustup component add --toolchain "$version-$toolchain" rustfmt clippy
"""

[tasks."rust:deny:install"]
description = "Install pinned cargo-deny"
wait_for = ["rust:components"]
run = """
set -eu

cargo_deny_version="0.20.2"
cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
cargo_deny="$cargo_tools_dir/bin/cargo-deny"

if [ ! -x "$cargo_deny" ] || ! "$cargo_deny" --version | grep -qxF "cargo-deny $cargo_deny_version"; then
  cargo install cargo-deny --version "$cargo_deny_version" --locked --root "$cargo_tools_dir"
fi
"""

[tasks."rust:mutants:install"]
description = "Install pinned cargo-mutants"
wait_for = ["rust:components"]
run = """
set -eu

cargo_mutants_version="27.1.0"
cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
cargo_mutants="$cargo_tools_dir/bin/cargo-mutants"

if [ ! -x "$cargo_mutants" ] || ! "$cargo_mutants" mutants --version | grep -qxF "cargo-mutants $cargo_mutants_version"; then
  cargo install cargo-mutants --version "$cargo_mutants_version" --locked --root "$cargo_tools_dir"
fi
"""

[tasks."rust:machete:install"]
description = "Install pinned cargo-machete"
wait_for = ["rust:components"]
run = """
set -eu

cargo_machete_version="0.9.2"
cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
cargo_machete="$cargo_tools_dir/bin/cargo-machete"

if [ ! -x "$cargo_machete" ] || ! "$cargo_machete" --version | grep -qxF "$cargo_machete_version"; then
  cargo install cargo-machete --version "$cargo_machete_version" --locked --root "$cargo_tools_dir"
fi
"""

[tasks."rust:lock:check"]
description = "Ensure Cargo.lock exists and matches Cargo metadata"
run = """
set -eu

if [ ! -f Cargo.lock ]; then
  if [ "${CI:-false}" = "true" ]; then
    echo "Cargo.lock is required in CI. Run mise run rust:lock:check locally and commit Cargo.lock." >&2
    exit 1
  fi

  cargo generate-lockfile
fi

cargo metadata --locked --format-version=1 >/dev/null
"""

[tasks."rust:lock"]
description = "Refresh Cargo.lock after dependency changes"
run = "cargo generate-lockfile"

[tasks."rust:fmt"]
description = "Format Rust code"
depends = ["rust:components"]
run = "cargo fmt --all"

[tasks."rust:fmt:check"]
description = "Check Rust formatting"
depends = ["rust:components"]
run = "cargo fmt --all -- --check"

[tasks."rust:policy"]
description = "Prove attribute and configured state-wall policies"
depends = ["rust:components", "rust:lock:check"]
run = """
set -eu

cargo test --test allow_policy --locked
sh scripts/verify-mutants.sh --self-test
sh scripts/mutants-lock.sh --self-test

probe_log="$(mktemp)"
trap 'rm -f "$probe_log"' EXIT
if clippy-driver policy-fixtures/disallowed-mutex.rs --edition=2024 --error-format=json -D clippy::disallowed_types >"$probe_log" 2>&1; then
  echo "Clippy accepted the configured disallowed Mutex type." >&2
  exit 1
fi
if ! grep -q '"code":"clippy::disallowed_types"' "$probe_log"; then
  cat "$probe_log" >&2
  echo "The Mutex policy probe failed for an unexpected reason." >&2
  exit 1
fi

echo "The syntax-aware allow scanner and configured Clippy state wall passed."
"""

[tasks."rust:lint"]
description = "Run Clippy for all Rust workspace targets/features"
depends = ["rust:components", "rust:lock:check", "rust:policy"]
wait_for = ["rust:fmt:check"]
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -F clippy::allow_attributes -F clippy::allow_attributes_without_reason"

[tasks."rust:test"]
description = "Run Rust tests for all workspace targets/features"
depends = ["rust:lock:check"]
wait_for = ["rust:lint"]
run = "cargo test --workspace --all-targets --all-features --locked"

[tasks."rust:test:doc"]
description = "Run Rust doctests"
depends = ["rust:lock:check"]
wait_for = ["rust:test"]
run = "cargo test --workspace --doc --all-features --locked"

[tasks."rust:doc"]
description = "Build Rust documentation with warnings denied"
depends = ["rust:lock:check"]
wait_for = ["rust:test:doc"]
run = "RUSTDOCFLAGS=\"-D warnings -D missing_docs\" cargo doc --workspace --all-features --no-deps --locked"

[tasks."rust:package"]
description = "Validate Rust package contents"
depends = ["rust:lock:check"]
wait_for = ["rust:doc"]
run = "cargo package --workspace --allow-dirty --locked"

[tasks."rust:mutants"]
description = "Run mutation testing; a surviving mutant is a review finding"
depends = ["rust:mutants:install", "rust:lock:check"]
wait_for = ["rust:test"]
run = """
set -eu

cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
. scripts/mutants-lock.sh
acquire_mutants_task_lock full
trap mutants_task_release_lock EXIT
trap 'exit 129' HUP
trap 'exit 130' INT
trap 'exit 143' TERM

run_mutants_task_child "$cargo_tools_dir/bin/cargo-mutants" mutants --output=. --workspace --all-features --test-workspace=true --cargo-arg=--locked
run_mutants_task_child sh scripts/verify-mutants.sh full mutants.out
"""

[tasks."rust:mutants:diff"]
description = "Mutation-test changed code; default base prefers origin/main"
depends = ["rust:mutants:install", "rust:lock:check"]
run = """
set -eu

diff_file="$(mktemp)"
trap 'rm -f "$diff_file"' EXIT

if [ -n "${MUTANTS_BASE_REF:-}" ]; then
  base_ref="$MUTANTS_BASE_REF"
  if ! base_commit="$(git rev-parse --verify --quiet "$base_ref^{commit}")"; then
    echo "Cannot resolve explicit MUTANTS_BASE_REF '$base_ref'." >&2
    exit 1
  fi
elif base_commit="$(git rev-parse --verify --quiet 'refs/remotes/origin/main^{commit}')"; then
  base_ref="origin/main"
elif base_commit="$(git rev-parse --verify --quiet 'refs/heads/main^{commit}')"; then
  base_ref="main"
else
  echo "Cannot resolve default base refs/remotes/origin/main or refs/heads/main." >&2
  exit 1
fi

if ! merge_base="$(git merge-base HEAD "$base_commit")"; then
  echo "Cannot compute a merge base with $base_ref. Fetch full history with git fetch --unshallow or git fetch origin main." >&2
  exit 1
fi
if ! printf '%s\n' "$merge_base" | grep -Eq '^[0-9a-f]{40}$'; then
  echo "git merge-base did not return an exact 40-character commit SHA." >&2
  exit 1
fi
if ! untracked_files="$(git ls-files --others --exclude-standard)"; then
  echo "Cannot inspect untracked files before mutation diff testing." >&2
  exit 1
fi
if [ -n "$untracked_files" ]; then
  echo "Mutation diff testing cannot include these untracked files:" >&2
  printf '%s\n' "$untracked_files" >&2
  echo "Stage them, or run git add -N <path> for each file so the diff becomes reviewable." >&2
  exit 1
fi

git diff --relative "$merge_base" -- > "$diff_file"

if [ ! -s "$diff_file" ]; then
  echo "No changes relative to $base_ref; nothing to mutate."
  exit 0
fi

cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
. scripts/mutants-lock.sh
acquire_mutants_task_lock diff
trap 'mutants_task_release_lock; rm -f "$diff_file"' EXIT
trap 'exit 129' HUP
trap 'exit 130' INT
trap 'exit 143' TERM

run_mutants_task_child "$cargo_tools_dir/bin/cargo-mutants" mutants --output=. --workspace --all-features --test-workspace=true --cargo-arg=--locked --in-diff "$diff_file"
run_mutants_task_child sh scripts/verify-mutants.sh diff mutants.out
"""

[tasks."rust:machete"]
description = "Detect unused [dependencies] entries with Cargo metadata"
depends = ["rust:machete:install", "rust:lock:check"]
run = """
set -eu

cargo metadata --all-features --locked --format-version=1 >/dev/null
cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
CARGO_NET_OFFLINE=true "$cargo_tools_dir/bin/cargo-machete" --with-metadata
"""

[tasks."rust:deny"]
description = "Run cargo-deny dependency policy checks"
depends = ["rust:deny:install", "rust:lock:check"]
run = """
set -eu

cargo_tools_dir="${CARGO_TOOLS_DIR:-.cargo-tools}"
"$cargo_tools_dir/bin/cargo-deny" --workspace --all-features --locked check -A license-not-encountered
"""

[tasks."rust:standards"]
description = "Run the Rust standards workflow with autofixes"
depends = ["rust:fmt"]

[tasks."rust:standards:check"]
description = "Run the Rust standards CI gate"
depends = [
  "rust:fmt:check",
  "rust:lint",
  "rust:test",
  "rust:test:doc",
  "rust:doc",
  "rust:package",
  "rust:mutants",
  "rust:machete",
  "rust:deny",
]
