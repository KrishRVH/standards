[settings]
experimental = true

[tools]
"pkgx:llvm.org" = "22.1.8"
"conda:clang-tools" = "22.1.8"
"conda:gcc" = "15.2.0"
clang-format = "22.1.8"
cmake = "4.4.0"
ninja = "1.13.2"

[tasks."c:fmt"]
description = "Format C sources with the pinned presentation contract"
run = "./c-format.sh write ."

[tasks."c:fmt:check"]
description = "Check C sources with the pinned presentation contract"
run = "./c-format.sh check ."

[tasks."c:lint"]
description = "Run mandatory C compiler and direct clang-tidy checks"
run = [
  "cmake -E remove_directory build/clang-fast",
  "cmake --preset clang-fast",
  "./c-build.sh verify-preset-contract build/clang-fast none Debug Clang",
  "cmake --build --preset clang-fast --parallel",
  "./c-quality.sh hard . build/clang-fast",
]

[tasks."c:advisory"]
description = "Run the reviewed, non-autofix clang-tidy advisory ratchet"
run = [
  "cmake -E remove_directory build/clang-fast",
  "cmake --preset clang-fast",
  "./c-build.sh verify-preset-contract build/clang-fast none Debug Clang",
  "cmake --build --preset clang-fast --parallel",
  "./c-quality.sh advisory . build/clang-fast",
]

[tasks."c:test"]
description = "Run native Clang tests, sanitizers, optimized tests, and consumers"
run = "./c-build.sh native"

[tasks."c:portability"]
description = "Run the pinned GCC extended portability gate"
run = "./c-build.sh portability"

[tasks."c:mingw"]
description = "Run the explicit MinGW-w64 compile-only exploratory gate"
run = "./c-build.sh mingw"

[tasks."c:regression"]
description = "Test the C standards configuration with positive and negative fixtures"
run = "./standards-tests/run.sh native"

[tasks."c:standards"]
description = "Run the C standards workflow with presentation autofixes"
depends = ["c:fmt"]

[tasks."c:standards:check"]
description = "Run every mandatory native C standards gate"
run = [
  { task = "c:fmt:check" },
  { task = "c:lint" },
  { task = "c:test" },
  { task = "c:regression" },
]
