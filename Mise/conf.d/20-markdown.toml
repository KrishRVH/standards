[tools]
bun = "1.4.5"
lychee = "0.24.2"
typos = "1.52.2"

[tasks."md:install"]
description = "Install Bun-managed Markdown dependencies"
depends = ["md:lock:check"]
run = "bun install --frozen-lockfile"

[tasks."md:lock"]
description = "Refresh the Bun lockfile for Markdown tooling"
run = "bun install"

[tasks."md:lock:check"]
description = "Ensure the Markdown Bun lockfile is present"
run = """
if [ ! -f bun.lock ]; then
  echo "bun.lock is required for Markdown CI. Run mise run md:lock and commit the generated lockfile." >&2
  exit 1
fi
"""

[tasks."md:fmt"]
description = "Fix Markdown structure where the linter can do so safely"
depends = ["md:install"]
run = "bun run md:lint:fix"

[tasks."md:fmt:check"]
description = "Check Markdown source structure without editing"
depends = ["md:lint"]

[tasks."md:lint"]
description = "Check headings, examples, metadata, and references"
depends = ["md:install"]
run = "bun run md:lint"

[tasks."md:links"]
description = "Check local Markdown and MDX links without network access"
run = "lychee --config lychee.toml --root-dir \"$PWD\" --offline --extensions md,mdx ."

[tasks."md:links:deep"]
description = "Check local and external Markdown and MDX links"
run = "lychee --config lychee.toml --root-dir \"$PWD\" --cache --extensions md,mdx ."

[tasks."md:typos"]
description = "Check project files and filenames for typos"
run = "typos --hidden --config typos.toml ."

[tasks."md:test"]
description = "Test the Markdown source policy"
depends = ["md:install"]
run = "bun run md:test"

[tasks."md:audit"]
description = "Audit Markdown tooling dependencies"
depends = ["md:install"]
run = "bun run md:audit"

[tasks."md:standards"]
description = "Run the Markdown standards workflow with autofixes"
depends = ["md:fmt"]

[tasks."md:standards:check"]
description = "Run the Markdown standards CI gate"
depends = ["md:lint", "md:test", "md:links", "md:typos"]

[tasks."md:standards:check:deep"]
description = "Run the Markdown CI gate plus external link and dependency checks"
depends = ["md:standards:check", "md:links:deep", "md:audit"]
