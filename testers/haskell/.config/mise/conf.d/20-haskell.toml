[env]
HASKELL_GHC_VERSION = "9.14.1"

[tools]
ghcup = "0.2.6.2"
cabal = "3.16.1.0"
hlint = "3.10"
ormolu = "0.8.1.1"

[tasks."haskell:install"]
description = "Install the pinned Haskell compiler and initialize the Cabal package index"
run = """
set -eu
ghcup run --install --ghc "$HASKELL_GHC_VERSION" -- ghc --version
repo_cache="$(cabal -v0 path --remote-repo-cache)"
if [ ! -d "$repo_cache" ] || [ -z "$(find "$repo_cache" -name 01-index.tar -print -quit)" ]; then
  cabal update
fi
"""

[tasks."haskell:update"]
description = "Refresh the Cabal package index"
run = "cabal update"

[tasks."haskell:fmt"]
description = "Format Haskell source"
run = "scripts/format.sh write"

[tasks."haskell:fmt:check"]
description = "Check Haskell formatting"
run = "scripts/format.sh check"

[tasks."haskell:lint"]
description = "Run Haskell static checks"
depends = ["haskell:install"]
run = [
  """
  paths=""
  for path in src app test bench; do
    if [ -e "$path" ]; then
      paths="$paths $path"
    fi
  done
  if [ -n "$paths" ]; then
    hlint $paths
  else
    hlint .
  fi
  """,
  "cabal check",
  '''ghcup run --ghc "$HASKELL_GHC_VERSION" -- cabal build all --enable-tests --enable-benchmarks''',
]

[tasks."haskell:test"]
description = "Run Haskell tests"
depends = ["haskell:install"]
wait_for = ["haskell:lint"]
run = "ghcup run --ghc \"$HASKELL_GHC_VERSION\" -- cabal test all --test-show-details=direct"

[tasks."haskell:bench"]
description = "Run Haskell benchmarks"
depends = ["haskell:install"]
run = "ghcup run --ghc \"$HASKELL_GHC_VERSION\" -- cabal bench all"

[tasks."haskell:docs"]
description = "Build Haskell API documentation"
depends = ["haskell:install"]
wait_for = ["haskell:test"]
run = "ghcup run --ghc \"$HASKELL_GHC_VERSION\" -- cabal haddock all --haddock-all"

[tasks."haskell:package"]
description = "Validate Haskell source distributions"
depends = ["haskell:install"]
wait_for = ["haskell:docs"]
run = "ghcup run --ghc \"$HASKELL_GHC_VERSION\" -- cabal sdist all"

[tasks."haskell:freeze"]
description = "Refresh cabal.project.freeze"
depends = ["haskell:install"]
run = "ghcup run --ghc \"$HASKELL_GHC_VERSION\" -- cabal freeze"

[tasks."haskell:standards"]
description = "Run the Haskell standards workflow with autofixes"
depends = ["haskell:fmt"]

[tasks."haskell:standards:check"]
description = "Run the Haskell standards CI gate"
depends = ["haskell:fmt:check", "haskell:lint", "haskell:test", "haskell:docs", "haskell:package"]
