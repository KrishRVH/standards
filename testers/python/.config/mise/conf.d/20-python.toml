[env]
# uv uses the pinned Python that mise puts first on PATH and never downloads its own.
UV_PYTHON_PREFERENCE = "only-system"
UV_PYTHON_DOWNLOADS = "never"

[tools]
python = "3.14.7"
uv = "0.12.21"

[tasks."py:install"]
description = "Install Python dependencies"
depends = ["py:lock:check"]
run = "uv sync --locked"

[tasks."py:install:deep"]
description = "Install Python dependencies including optional deep analyzers"
depends = ["py:lock:check"]
run = "uv sync --group deep --locked"

[tasks."py:lock"]
description = "Refresh the uv lockfile"
run = "uv lock"

[tasks."py:lock:check"]
description = "Ensure the uv lockfile is present and current"
run = """
if [ ! -f uv.lock ]; then
  echo "uv.lock is required for Python CI. Run mise run py:lock and commit the generated lockfile." >&2
  exit 1
fi

uv lock --check
"""

[tasks."py:fmt"]
description = "Format Python source and tests"
depends = ["py:install"]
run = "uv run ruff format ."

[tasks."py:fmt:check"]
description = "Check Python formatting"
depends = ["py:install"]
run = "uv run ruff format --check ."

[tasks."py:ruff"]
description = "Run Ruff lint rules"
depends = ["py:install"]
run = "uv run ruff check ."

[tasks."py:suppressions"]
description = "Enforce reasoned, per-site Python suppressions"
depends = ["py:install"]
run = "uv run python -I scripts/check-suppressions.py"

[tasks."py:type"]
description = "Run strict Python type analysis"
depends = ["py:install"]
run = "uv run basedpyright"

[tasks."py:security"]
description = "Run Python security analysis"
depends = ["py:install"]
run = "uv run bandit -c pyproject.toml -r src"

[tasks."py:lint"]
description = "Run default Python static analysis"
depends = ["py:ruff", "py:suppressions", "py:type", "py:security"]

[tasks."py:test"]
description = "Run Python tests with branch coverage"
depends = ["py:install"]
run = "uv run pytest"

[tasks."py:build"]
description = "Build Python source and wheel distributions"
depends = ["py:install"]
run = "uv build"

[tasks."py:audit"]
description = "Audit Python dependencies"
depends = ["py:install"]
run = "uv audit --preview-features audit-command --locked"

[tasks."py:deps"]
description = "Check Python dependency hygiene"
depends = ["py:install"]
run = "uv run deptry ."

[tasks."py:mutants"]
description = "Run a fresh mutation sweep; a surviving mutant is a review finding"
depends = ["py:install"]
run = "uv run python -I scripts/run-mutation-transaction.py full"

[tasks."py:mutants:incremental"]
description = "Reuse valid cached mutmut results for the mutation-testing inner loop"
depends = ["py:install"]
run = "uv run python -I scripts/run-mutation-transaction.py incremental"

[tasks."py:type:mypy"]
description = "Run optional strict mypy analysis"
depends = ["py:install:deep"]
run = "uv run --no-sync mypy"

[tasks."py:docs"]
description = "Require every counted Python object to have a docstring"
depends = ["py:install:deep"]
run = """
set -eu

report="$(mktemp)"
trap 'rm -f "$report"' EXIT
uv run --no-sync interrogate --fail-under=100 --no-color --output "$report" .
cat "$report"
uv run --no-sync python -I scripts/check-interrogate-report.py "$report"
"""

[tasks."py:complexity"]
description = "Check Python complexity budgets"
depends = ["py:install:deep"]
run = "uv run --no-sync xenon --max-absolute B --max-modules A --max-average A src tests"

[tasks."py:slots"]
description = "Check dataclass slot coverage"
depends = ["py:install:deep"]
run = "uv run --no-sync slotscheck src"

[tasks."py:deadcode"]
description = "Check for high-confidence dead Python code"
depends = ["py:install:deep"]
run = "uv run --no-sync vulture"

[tasks."py:deep"]
description = "Run optional dependency-sensitive Python analysis"
depends = ["py:type:mypy", "py:docs", "py:complexity", "py:slots", "py:deadcode"]

[tasks."py:standards"]
description = "Run the Python standards workflow with autofixes"
depends = ["py:install"]
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks."py:standards:check"]
description = "Run the Python standards CI gate"
depends = ["py:fmt:check", "py:lint", "py:test", "py:build", "py:audit", "py:deps", "py:mutants"]

[tasks."py:standards:check:deep"]
description = "Run the Python standards CI gate plus optional deep analysis"
run = [
  { task = "py:standards:check" },
  { task = "py:deep" },
]
