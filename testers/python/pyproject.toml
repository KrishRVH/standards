[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "project-name"
version = "0.1.0"
description = "A strict Python project."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-Proprietary"
authors = [{ name = "Project contributors" }]
dependencies = []

[dependency-groups]
dev = [
  "bandit[toml]>=1.9.4",
  "basedpyright>=1.39.9",
  "coverage[toml]>=7.15.2",
  "deptry>=0.25.1",
  "hatchling>=1.31.0",
  "hypothesis>=6.165.10",
  "mutmut>=3.7.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.0",
]
deep = [
  "interrogate>=1.7.0",
  "mypy>=2.3.0",
  "slotscheck>=0.20.1",
  "vulture>=2.16",
  "xenon>=0.9.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/project_name"]

[tool.ruff]
# mutmut writes its generated source copy to the root mutants/ directory. Keep
# that tree out of Ruff while still checking legitimate nested mutants/ names.
extend-exclude = ["mutants/**"]
line-length = 100
required-version = ">=0.16.0"
show-fixes = true
src = ["src", "tests"]
target-version = "py314"
unsafe-fixes = false

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
# Beyond the correctness baseline: PGH bans blanket suppressions, RUF100
# expires dead noqa comments, RUF101 rewrites redirected rule codes, and
# RUF102 rejects unknown codes. S mirrors bandit so security suppressions ride
# the policed noqa channel, TID251 carries the banned-API wall, PLW0603 bans
# `global`, ASYNC and DTZ catch blocking sleeps in async code and naive
# datetimes.
select = [
  "ASYNC",
  "B",
  "DTZ",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "PGH",
  "PLW0603",
  "RUF100",
  "RUF101",
  "RUF102",
  "S",
  "TID251",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert invariants the test itself established.
"tests/**" = ["S101"]

# Banned-API wall: ambient state and footguns, banned by symbol with a
# remediation message naming the replacement. Escape per site with
# `# noqa: TID251` plus a reason; RUF100 expires the escape when it goes
# stale. The list is examples, not the rule: routing around it through an
# equivalent API violates the doctrine, not just the lint.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Ambient clock. Inject a clock; tz-aware now(tz) at the composition root only."
"datetime.datetime.utcnow".msg = "Naive UTC time. Use datetime.now(timezone.utc) at the composition root."
"datetime.date.today".msg = "Ambient clock. Inject a clock."
"time.time".msg = "Ambient clock. Inject a clock."
"random.random".msg = "Ambient global RNG. Take a random.Random instance as a parameter."
"random.randint".msg = "Ambient global RNG. Inject random.Random."
"random.choice".msg = "Ambient global RNG. Inject random.Random."
"random.seed".msg = "Seeding the process-global RNG is shared mutable state. Inject random.Random(seed)."
"os.environ".msg = "Ambient config. Read the environment at the composition root; pass values explicitly."
"os.putenv".msg = "Mutates process-global state invisible to os.environ."
"os._exit".msg = "Bypasses finally, atexit, and coverage. Raise SystemExit or return an exit code."
"pickle".msg = "Arbitrary code execution on load. Use json or an explicit schema."

[tool.ruff.lint.isort]
known-first-party = ["project_name"]

[tool.basedpyright]
include = ["scripts", "src", "tests"]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "all"
venvPath = "."
venv = ".venv"
failOnWarnings = true
reportAny = "error"
reportExplicitAny = "error"
# Suppressions are per-site and self-expiring: an ignore comment must name a
# rule, and a stale ignore fails the build. Both default on in "all"
# mode; pinned here because the wall must not depend on mode defaults.
reportIgnoreCommentWithoutRule = "error"
reportImplicitOverride = "error"
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "error"
reportUnusedCallResult = "none"

[tool.mypy]
files = ["scripts", "src", "tests"]
python_version = "3.14"
strict = true
explicit_package_bases = true
mypy_path = ["src", "."]
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_unimported = true
pretty = true
show_column_numbers = true
show_error_code_links = true
show_error_codes = true
show_error_end = true
strict_equality_for_none = true
warn_unreachable = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=project_name",
  "--cov-report=term-missing:skip-covered",
]
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["project_name"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
# Ratchet floor: raising it is normal work; lowering it is a wall edit that
# requires human countersign.
fail_under = 100
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["src/"]
# Boundary tests invoke the copied policy scripts and inspect task contracts
# from inside mutmut's isolated working tree.
also_copy = [".config/", "scripts/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Per-mutant coverage instrumentation is waste; the coverage gate runs once
# in py:test.
pytest_add_cli_args = ["--no-cov"]

[tool.deptry]
extend_exclude = [".git", ".gstack", ".venv", "mutants"]
known_first_party = ["project_name"]

[tool.bandit]
exclude_dirs = [".git", ".gstack", ".venv", "tests"]
recursive = true
targets = ["src"]

[tool.interrogate]
exclude = [".git", ".gstack", ".venv", "mutants", "tests"]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-module = false
ignore-nested-functions = false
ignore-private = true
ignore-private-nested = true
ignore-semiprivate = true
verbose = 1

[tool.vulture]
exclude = [".git", ".gstack", ".venv"]
min_confidence = 90
paths = ["src", "tests"]
sort_by_size = true
