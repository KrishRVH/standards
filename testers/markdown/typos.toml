[default]
check-file = false
check-filename = false
locale = "en-us"

[type.markdown]
extend-glob = ["*.md", "*.mdx"]
check-file = true
check-filename = true

[files]
extend-exclude = [
  ".git",
  ".next",
  ".nuxt",
  ".svelte-kit",
  ".turbo",
  ".vite",
  "build",
  "bun.lock",
  "coverage",
  "dist",
  "node_modules",
  "out",
  "sbom",
]
