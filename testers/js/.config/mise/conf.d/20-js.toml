[tools]
bun = "1.3.14"

[tasks."js:install"]
description = "Install Bun-managed JavaScript dependencies"
wait_for = ["js:lock:check"]
run = "bun install --frozen-lockfile"

[tasks."js:lock"]
description = "Refresh the Bun lockfile"
run = "bun install"

[tasks."js:lock:check"]
description = "Ensure the Bun lockfile is present"
run = """
if [ ! -f bun.lock ]; then
  echo "bun.lock is required for JavaScript CI. Run mise run js:lock and commit the generated lockfile." >&2
  exit 1
fi
"""

[tasks."js:run"]
description = "Run a Bun package script: mise run js:run -- <script>"
usage = "arg \"script\""
run = "bun run \"$usage_script\""

[tasks."js:fmt"]
description = "Format JavaScript"
depends = ["js:install"]
run = "bun run format"

[tasks."js:fmt:check"]
description = "Check JavaScript formatting"
depends = ["js:install"]
run = "bun run format:check"

[tasks."js:lint"]
description = "Lint JavaScript"
depends = ["js:install"]
run = "bun run lint"

[tasks."js:type"]
description = "Run jsconfig.json type checks"
depends = ["js:install"]
run = "bun run typecheck"

[tasks."js:test"]
description = "Run JavaScript tests"
depends = ["js:install"]
run = "bun run test"

[tasks."js:audit"]
description = "Audit JavaScript dependencies"
depends = ["js:install"]
run = "bun run audit"

[tasks."js:standards"]
description = "Run the JavaScript standards workflow with autofixes"
depends = ["js:install"]
run = "bun run standards"

[tasks."js:standards:check"]
description = "Run the JavaScript standards CI gate"
depends = ["js:lock:check", "js:install"]
run = "bun run standards:check"
