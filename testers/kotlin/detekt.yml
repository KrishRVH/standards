config:
  validation: true
  warningsAsErrors: true

complexity:
  CyclomaticComplexMethod:
    allowedComplexity: 10
  LongMethod:
    allowedLines: 60
  LongParameterList:
    allowedConstructorParameters: 8
    allowedFunctionParameters: 6
  NestedBlockDepth:
    allowedDepth: 3
  TooManyFunctions:
    allowedFunctionsPerClass: 12
    allowedFunctionsPerEnum: 12
    allowedFunctionsPerFile: 20
    allowedFunctionsPerInterface: 12
    allowedFunctionsPerObject: 12

naming:
  FunctionNaming:
    functionPattern: "[a-z][a-zA-Z0-9]*"
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][_A-Z0-9]*"

style:
  # Named constants for every status code, timeout, and size add ceremony
  # without catching defects.
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 100
  ReturnCount:
    max: 3
  ThrowsCount:
    max: 2
