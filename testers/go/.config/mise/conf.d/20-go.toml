[env]
GOTOOLCHAIN = "local"

[tools]
go = "1.27.1"
gofumpt = "0.11.0"
golangci-lint = "2.13.2"
"go:github.com/KrishRVH/boringlint/cmd/boringlint" = { version = "v0.9.5", depends = "go" }
"go:golang.org/x/vuln/cmd/govulncheck" = { version = "1.7.0", depends = "go" }

[tasks."go:install"]
description = "Download Go module dependencies"
wait_for = ["go:mod:check"]
run = "go mod download"

[tasks."go:tools:rebuild"]
description = "Rebuild pinned Go analyzers after a compiler upgrade"
run = "mise install --force go:github.com/KrishRVH/boringlint/cmd/boringlint go:golang.org/x/vuln/cmd/govulncheck"

[tasks."go:fmt"]
description = "Format first-party Go source with native gofumpt exclusions"
run = "gofumpt -w ."

[tasks."go:fmt:check"]
description = "Check first-party Go formatting"
run = """
set -eu
files="$(gofumpt -l .)"
if [ -n "$files" ]; then
  printf '%s\\n' "$files"
  exit 1
fi
"""

[tasks."go:mod:tidy"]
description = "Tidy Go module files"
run = "go mod tidy"

[tasks."go:mod:check"]
description = "Check Go module tidiness before downloads can repair it"
run = "go mod tidy -diff"

[tasks."go:mod:verify"]
description = "Verify downloaded Go modules"
depends = ["go:install"]
run = "go mod verify"

[tasks."go:lint"]
description = "Run Go static analysis and dependency checks"
depends = ["go:mod:check", "go:mod:verify"]
run = [
  "go vet ./...",
  "boringlint ./...",
  "golangci-lint run ./...",
  "govulncheck -test ./...",
]

[tasks."go:test"]
description = "Run Go tests"
depends = ["go:install"]
run = "go test -trimpath -count=1 ./..."

[tasks."go:test:race"]
description = "Run Go tests with the race detector"
depends = ["go:install"]
wait_for = ["go:test"]
run = "go test -trimpath -race -count=1 ./..."

[tasks."go:cover"]
description = "Run Go tests with coverage"
depends = ["go:install"]
wait_for = ["go:test:race"]
run = """
set -eu
mkdir -p coverage
go test -trimpath -count=1 -coverpkg=./... -covermode=atomic -coverprofile=coverage/go.out ./...
go tool cover -func=coverage/go.out
min="${GO_COVER_MIN:-}"
if [ -n "$min" ]; then
  if ! awk -v min="$min" 'BEGIN { exit(min ~ /^[0-9]+([.][0-9]+)?$/ && min + 0 <= 100 ? 0 : 1) }'; then
    echo "GO_COVER_MIN must be a decimal from 0 to 100: $min" >&2
    exit 2
  fi
  actual="$(go tool cover -func=coverage/go.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')"
  awk -v actual="$actual" -v min="$min" 'BEGIN { exit(actual + 0 >= min + 0 ? 0 : 1) }' || {
    echo "coverage ${actual}% is below required ${min}%"
    exit 1
  }
fi
"""

[tasks."go:bench"]
description = "Run Go benchmarks"
depends = ["go:install"]
run = "go test -trimpath -run=^$ -bench=. -benchmem ./..."

[tasks."go:standards"]
description = "Run the Go standards workflow with autofixes"
run = [
  { task = "go:fmt" },
  { task = "go:mod:tidy" },
]

[tasks."go:standards:check"]
description = "Run the Go standards CI gate"
depends = ["go:fmt:check", "go:lint", "go:test", "go:test:race", "go:cover"]
