[run]
bun = true

[install]
# New dependencies land exact-pinned, matching the manifest policy.
exact = true
# Refuse versions younger than three days; most registry malware is caught and
# unpublished inside that window. This bites only when the lock changes, which
# is exactly when supply-chain attacks land.
minimumReleaseAge = 259200
# Deliberately empty: this list is the documented, countersigned emergency
# path past the age gate (see README); adding an entry is a wall edit.
minimumReleaseAgeExcludes = []
peer = false
