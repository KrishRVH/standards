name: Quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      MISE_LOCKED: "1"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          install: true
          cache: true
          # The action installs every fixture's tools with --monorepo, but its
          # default key hashes only the root config, so the fixture lockfiles
          # join the key.
          cache_key: "{{default}}-${{ hashFiles('testers/*/.config/mise/mise.lock') }}"
      - name: Run the repository gate
        run: mise run standards:check
