[profiles.csharp]
name = "C#"
template = "C#"
tester = "testers/csharp"
task_prefix = "csharp"
task_fragment = "20-csharp.toml"
mirror = [
  ".editorconfig",
  "BannedSymbols.txt",
  "Directory.Build.props",
  "Directory.Packages.props",
  "global.json",
  "scripts/Directory.Build.props",
  "scripts/Directory.Packages.props",
  "scripts/verify-standards.cs",
  "stryker-config.json",
]

[profiles.go]
name = "Go"
template = "Go"
tester = "testers/go"
task_prefix = "go"
task_fragment = "20-go.toml"
mirror = [".golangci.yml", "AGENTS.md", "README.md", "go.mod"]
required_tester_files = ["tests/format_tasks_test.go"]

[profiles.kotlin]
name = "Kotlin"
template = "Kotlin"
tester = "testers/kotlin"
task_prefix = "kotlin"
task_fragment = "20-kotlin.toml"
mirror = [".editorconfig", "build.gradle.kts", "detekt.yml", "gradle.properties", "settings.gradle.kts"]
required_tester_files = ["gradle.lockfile", "gradle/verification-metadata.xml"]

[profiles.markdown]
name = "Markdown/MDX"
template = "Markdown"
tester = "testers/markdown"
task_prefix = "md"
task_fragment = "20-markdown.toml"
mirror = [
  ".markdownlint-cli2.jsonc",
  ".prettierignore",
  "content/example.mdx",
  "docs/example.md",
  "lychee.toml",
  "package.json",
  "prettier.config.mjs",
  "scripts/check-mdx.mjs",
  "scripts/check-mdx.test.mjs",
  "typos.toml",
]
required_tester_files = ["bun.lock"]

[profiles.python]
name = "Python"
template = "Python"
tester = "testers/python"
task_prefix = "py"
task_fragment = "20-python.toml"
mirror = [
  "pyproject.toml",
  "scripts/check-interrogate-report.py",
  "scripts/check-mutation-score.py",
  "scripts/check-suppressions.py",
  "scripts/run-mutation-transaction.py",
]
dagger = true

[profiles.rust]
name = "Rust"
template = "Rust"
tester = "testers/rust"
task_prefix = "rust"
task_fragment = "20-rust.toml"
mirror = [
  "Cargo.toml",
  "clippy.toml",
  "deny.toml",
  "policy-fixtures/disallowed-mutex.rs",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "scripts/mutants-lock.sh",
  "scripts/verify-mutants.sh",
  "tests/allow_policy.rs",
  "tests/mutation_report_policy.rs",
]

[profiles.shell]
name = "Shell"
template = "Shell"
tester = "testers/shell"
task_prefix = "shell"
task_fragment = "20-shell.toml"
mirror = [
  ".editorconfig",
  ".shellcheckrc",
  "AGENTS.md",
  "README.md",
  "scripts/project-name.sh",
  "scripts/shell-standards.sh",
  "tests/project-name.bats",
]

[profiles.swift]
name = "Swift"
template = "Swift"
tester = "testers/swift"
task_prefix = "swift"
task_fragment = "20-swift.toml"
mirror = [
  ".github/CODEOWNERS",
  ".github/pull_request_template.md",
  ".github/workflows/quality.yml",
  ".swift-format",
  "AGENTS.md",
  "Package.swift",
  "README.md",
  "scripts/verify-standards.swift",
]

