[default]
check-file = true
check-filename = true
locale = "en-us"
# Flyline names these public style keys with British spelling.
extend-ignore-re = ['\b(?:un)?recognised-command\b']

[files]
extend-exclude = [
  ".build",
  ".cache",
  ".gradle",
  ".kotlin",
  "build",
  "bun.lock",
  "coverage",
  "Dagger/dagger/src/index.ts",
  "dist",
  "node_modules",
  "out",
  "sbom",
  "target",
  "testers/*/dagger/src/index.ts",
  "vendor",
]
