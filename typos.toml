[default]
check-file = true
check-filename = true
locale = "en-us"

[default.extend-identifiers]
optin = "optin"

[default.extend-words]
# Alire's lockfile key, spelled as Alire writes it.
fulfilment = "fulfilment"

[files]
extend-exclude = [
  ".cache",
  ".godot",
  ".gradle",
  ".kotlin",
  ".lua_modules",
  ".zig-cache",
  "_build",
  "build",
  "bun.lock",
  "coverage",
  "Dagger/dagger/src/index.ts",
  "deps",
  "dist",
  "dist-newstyle",
  "node_modules",
  "out",
  "PHP/composer.json",
  "sbom",
  "target",
  "testers/*/dagger/src/index.ts",
  "testers/php/composer.json",
  "vendor",
  "zig-out",
  "zig-pkg",
]
